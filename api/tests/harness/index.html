<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEST-ONLY reviews render</title>
<style>
body{margin:0;background:#f5f1e8;color:#1a1916;font:16px/1.6 Arial,sans-serif}header{padding:20px;background:#1a1916;color:#fff;font-weight:bold}section{max-width:1024px;margin:48px auto;padding:32px;background:#ede7d8;border:1px solid #d4ccb4;border-radius:4px}h1{font:48px/1.1 Georgia,serif;margin:12px 0}.eyebrow{font:12px monospace;text-transform:uppercase;letter-spacing:.16em}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:28px 0}article{background:#f5f1e8;border:1px solid #d4ccb4;padding:20px;border-radius:3px}a{color:inherit;text-decoration-color:#d4582a;text-underline-offset:4px}.stars{color:#d4582a}.text{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden;white-space:pre-line}.meta{font-size:12px;color:#686157}.links{display:flex;justify-content:space-between;gap:12px;font-size:12px}.attribution{padding:10px 10px 5px}.text.expanded{-webkit-line-clamp:unset;display:block}button:focus-visible{outline:2px solid #d4582a;outline-offset:4px}.bottom{border-top:1px solid #d4ccb4;padding-top:20px}.notice{font-size:12px}@media(max-width:600px){section{margin:24px 16px;padding:24px}.cards{grid-template-columns:1fr}h1{font-size:38px}}
.top{display:flex;justify-content:space-between;gap:16px}.rating{display:flex;gap:20px;align-items:center;border-top:1px solid #d4ccb4;padding-top:24px;margin-top:28px}.number{font:60px Georgia,serif}.stars{display:inline-flex;gap:4px}.stars svg{width:18px;height:18px}.author{display:flex;gap:12px;align-items:center}.avatar{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:40px;height:40px;border-radius:50%;background:#e2dac5;font:12px monospace}.byline{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}.byline a{font-size:14px;font-weight:600}.text{font-size:14px;line-height:1.65}article{display:flex;flex-direction:column;transition:transform .3s}.links{margin-top:auto;padding-top:20px}@media(min-width:1200px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){.top{flex-direction:column}}@media(prefers-reduced-motion:no-preference){article:hover{transform:translateY(-4px)}} </style><header>TEST-ONLY RENDER — MOCK FIXTURE, NOT REAL REVIEWS</header><main></main>
<script>
// Deliberately outside the export; all fixture strings render as text nodes.
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e};
const link=(text,url)=>{const e=el('a',text);try{if(url&&new URL(url).protocol==='https:')e.href=url}catch{}e.target='_blank';e.rel='noopener noreferrer';return e};
fetch('../fixtures/places-details.TEST-ONLY.json').then(r=>r.json()).then(d=>{
const stars=n=>{const row=el('span','','stars');row.setAttribute('aria-label',n+' out of 5 stars');row.setAttribute('role','img');for(let i=0;i<5;i++){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg'),path=document.createElementNS(ns,'path');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');path.setAttribute('d','m12 2 3 6.3 7 .9-5.1 4.9 1.3 6.9-6.2-3.3L5.8 21l1.3-6.9L2 9.2l7-.9Z');path.setAttribute('fill','currentColor');path.setAttribute('opacity','.18');svg.append(path);const fill=path.cloneNode();fill.setAttribute('opacity','1');const defs=document.createElementNS(ns,'defs'),clip=document.createElementNS(ns,'clipPath'),rect=document.createElementNS(ns,'rect'),id='clip-'+Math.random().toString(36).slice(2);clip.id=id;rect.setAttribute('width',24*Math.max(0,Math.min(1,n-i)));rect.setAttribute('height','24');clip.append(rect);defs.append(clip);fill.setAttribute('clip-path','url(#'+id+')');svg.append(defs,fill);row.append(svg)}return row};
const s=el('section'),top=el('div','','top'),heading=el('div');heading.append(el('p','From Google Maps','eyebrow'),el('h1','What clients say.'));const attr=el('div','','attribution'),logo=el('img');logo.src='../../../site/public/media/google-maps/GoogleMaps_Logo_Gray.svg';logo.alt='Google Maps';logo.width=98;logo.height=18;logo.translate=false;attr.append(logo);top.append(heading,attr);s.append(top);const rating=el('div','','rating'),summary=el('div');summary.append(stars(d.rating),el('div','Based on '+d.userRatingCount+' Google reviews','meta'));rating.append(el('span',String(d.rating),'number'),summary);s.append(rating);
const cards=el('div','','cards');for(const r of d.reviews){const a=el('article');const author=el('div','','author'),byline=el('div','','byline');byline.append(link(r.authorAttribution.displayName,r.authorAttribution.uri),el('time',r.relativePublishTimeDescription,'meta'));author.append(el('span',r.authorAttribution.displayName.split(/\s+/).slice(0,2).map(n=>n[0]).join(''),'avatar'),byline);a.append(author,stars(r.rating));if(r.text?.text){const text=el('p',r.text.text,'text'),button=el('button','Read full review');text.id='review-text-'+cards.children.length;button.type='button';button.setAttribute('aria-controls',text.id);button.setAttribute('aria-expanded','false');button.hidden=r.text.text.length<=280;button.onclick=()=>{const expanded=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(expanded));text.classList.toggle('expanded',expanded);button.textContent=expanded?'Show less':'Read full review'};a.append(text,button);requestAnimationFrame(()=>{const measure=()=>{const expanded=text.classList.contains('expanded');text.classList.remove('expanded');if(text.clientHeight>0)button.hidden=text.scrollHeight<=text.clientHeight;if(expanded)text.classList.add('expanded')};measure();if(typeof ResizeObserver!=='undefined')new ResizeObserver(measure).observe(text);else window.addEventListener('resize',measure)})}if(r.text?.languageCode!==r.originalText?.languageCode&&r.originalText)a.append(el('p','Translated by Google','meta'));const links=el('div','','links');links.append(link('Read on Google Maps',r.googleMapsUri));if(r.flagContentUri)links.append(link('Report',r.flagContentUri));a.append(links);cards.append(a)}s.append(cards);const bottom=el('div','','bottom');const notice=el('p',"These are up to five reviews from our Google Maps profile, shown in Google's order (most relevant first). We do not filter or edit them. ",'notice');notice.append(link('See all reviews on Google Maps',d.googleMapsUri),document.createTextNode('.'));bottom.append(notice,el('p',"Google doesn't verify reviews but removes fake content when it's found.",'notice'));s.append(bottom);document.querySelector('main').append(s);
});
</script></html>
