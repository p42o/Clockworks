<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Iris">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBE9E0"/><stop offset="1" stop-color="#F3CDB8"/></linearGradient>
    <clipPath id="c"><circle cx="48" cy="48" r="48"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="96" height="96" fill="url(#bg)"/>
    <circle cx="74" cy="20" r="16" fill="#fff" opacity=".35"/>
    <!-- sweater -->
    <path d="M14 96c2-19 16-29 34-29s32 10 34 29z" fill="#D4582A"/>
    <path d="M38 69c3 5 7 7 10 7s7-2 10-7" fill="none" stroke="#B8481E" stroke-width="3" stroke-linecap="round"/>
    <!-- neck -->
    <path d="M41 60h14v10c-4 3-10 3-14 0z" fill="#E7A983"/>
    <!-- hair back -->
    <path d="M24 46c0-17 10-28 24-28s24 11 24 28c0 9-2 16-5 20H29c-3-4-5-11-5-20z" fill="#3A2A22"/>
    <!-- face -->
    <ellipse cx="48" cy="45" rx="16.5" ry="18.5" fill="#F2BC97"/>
    <!-- fringe -->
    <path d="M30 42c1-13 9-21 19-21 9 0 16 6 18 16-7-1-14-5-18-10-3 7-10 13-19 15z" fill="#3A2A22"/>
    <!-- eyes: soft closed smile -->
    <path d="M39 47.5c1.4-1.8 3.8-1.8 5.2 0M51.8 47.5c1.4-1.8 3.8-1.8 5.2 0" fill="none" stroke="#2B1E18" stroke-width="2.2" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="38" cy="53" r="3" fill="#E98A6A" opacity=".45"/><circle cx="58" cy="53" r="3" fill="#E98A6A" opacity=".45"/>
    <!-- smile -->
    <path d="M44 55.5c2.4 2.4 5.6 2.4 8 0" fill="none" stroke="#9C3F27" stroke-width="2.2" stroke-linecap="round"/>
    <!-- earring: a tiny gear-copper stud -->
    <circle cx="31.6" cy="52" r="1.9" fill="#D4582A"/>
  </g>
</svg>
