name: Deploy to Namecheap

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Parker's page rule (2026-10-23): GA4, sitemap, canonical, robots, NAP/JSON-LD, inventory row.
      # A failure here stops the job before any gate config is written or anything is uploaded.
      - name: Page rule check (blocks deploy on failure)
        run: node site/scripts/check-pages.mjs
      - name: Write Eicher gate config (from secrets, never committed)
        env:
          EICHER_KEY: ${{ secrets.EICHER_KEY }}
          EICHER_PIN_HMAC: ${{ secrets.EICHER_PIN_HMAC }}
        run: |
          printf "<?php\nreturn ['key' => '%s', 'pin' => '%s'];\n" "$EICHER_KEY" "$EICHER_PIN_HMAC" > eicher/_config.php

      - name: Write Timely gate config (from secrets, never committed)
        env:
          TIMELY_KEY: ${{ secrets.TIMELY_KEY }}
          TIMELY_PIN_HMAC: ${{ secrets.TIMELY_PIN_HMAC }}
          TIMELY_ADMIN_HMAC: ${{ secrets.TIMELY_ADMIN_HMAC }}
          TIMELY_VIEWER_HMAC: ${{ secrets.TIMELY_VIEWER_HMAC }}
          TIMELY_NOTIFY: ${{ secrets.TIMELY_NOTIFY }}
          TIMELY_RESEND_KEY: ${{ secrets.TIMELY_RESEND_KEY }}
          TIMELY_NOTIFY_TO: ${{ secrets.TIMELY_NOTIFY_TO }}
        run: |
          printf "<?php\nreturn ['key' => '%s', 'pin' => '%s', 'admin' => '%s', 'viewer' => '%s', 'notify' => '%s', 'resend' => '%s', 'notify_to' => '%s'];\n" "$TIMELY_KEY" "$TIMELY_PIN_HMAC" "$TIMELY_ADMIN_HMAC" "$TIMELY_VIEWER_HMAC" "$TIMELY_NOTIFY" "$TIMELY_RESEND_KEY" "$TIMELY_NOTIFY_TO" > timely/_config.php

      - name: Write Nickel gate config (from secrets, never committed)
        env:
          NICKEL_KEY: ${{ secrets.NICKEL_KEY }}
          NICKEL_PIN_HMAC: ${{ secrets.NICKEL_PIN_HMAC }}
          NICKEL_ADMIN_HMAC: ${{ secrets.NICKEL_ADMIN_HMAC }}
        run: |
          printf "<?php\nreturn ['key' => '%s', 'pin' => '%s', 'admin' => '%s'];\n" "$NICKEL_KEY" "$NICKEL_PIN_HMAC" "$NICKEL_ADMIN_HMAC" > thenickel/_config.php

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            Archive.zip
            site/**
            **/node_modules/**
